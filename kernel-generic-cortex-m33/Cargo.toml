[package]
name = "kernel-generic-cortex-m33"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
rp235x-pac = { version = "0.1.0", features = ["rt"] }

[dependencies.hubris-kern]
package = "kern"
git = "https://github.com/Karthik-d-k/hubris-riscv-hazard3"
rev = "fb7563b852f8e4b7e0fafe1dd79627ec354c7d03"            # branch: no-mpu

[features]
no-mpu = ["hubris-kern/no-mpu"]
