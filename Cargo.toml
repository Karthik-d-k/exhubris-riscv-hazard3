[workspace]
resolver = "2"
members = [
    "kernel-generic-*",
    "sys/*",
    "task/*",
    "drv/*",
    "tools/build",
    "tools/hubake",
    "tools/alloc",

    "app/kbd/basic-scanner",
    "app/kbd/basic-scanner-api",
]

[workspace.dependencies]
userlib = {path = "sys/userlib"}
kipc = {path = "sys/kipc"}
hubris-num-tasks = {path = "sys/num-tasks"}
hubris-build = {path="tools/build"}
rp235x-gpio = { git = "https://github.com/Karthik-d-k/exhubris-riscv-hazard3", rev="407f8612f9456c3043e41568babe890171ceeeb5" } # branch: riscv

[profile.release]
debug = true
lto = true
opt-level = "s"
